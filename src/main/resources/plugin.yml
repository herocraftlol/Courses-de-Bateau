name: CourseDeBateau
version: 1.1.0
main: com.herocraft.coursedebateau.CourseDeBateauPlugin
api-version: 1.21
author: HeroCraft
description: Plugin Paper 1.21 de minijeu de courses de bateaux - arenes multiples, ligne de depart/arrivee distincte des checkpoints, zone spectateur facultative, sidebar en direct avec chronos et records persistes

commands:
  cdb:
    description: Commande principale du plugin Course de Bateau
    usage: |
      /cdb gui
      /cdb list
      /cdb join <course>
      /cdb leave
      /cdb create <course>
      /cdb delete <course>
      /cdb reload
      /cdb <course> info
      /cdb <course> setlobby
      /cdb <course> addboatspawn
      /cdb <course> removeboatspawn <index>
      /cdb <course> setcheckpoint <index> <pos1|pos2>
      /cdb <course> removecheckpoint <index>
      /cdb <course> laps <nombre>
      /cdb <course> maxplayers <nombre>
      /cdb <course> minplayers <nombre>
      /cdb <course> lobbycountdown <secondes>
      /cdb <course> startcountdown <secondes>
      /cdb <course> forcestart
      /cdb <course> stop
    aliases: [coursedebateau, boatrace]

permissions:
  cdb.admin:
    description: Permission pour administrer les courses de bateaux (creation, configuration des arenes)
    default: op
  cdb.play:
    description: Permission pour participer aux courses de bateaux
    default: true
